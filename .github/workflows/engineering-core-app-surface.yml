name: Engineering platform — unified validation

on:
  push:
    branches:
      - feature/engineering
  pull_request:
    paths:
      - 'src/lib/engineering/**'
      - 'src/components/engineering/**'
      - 'src/pages/SourceDerivedProjectPage*'
      - 'src/pages/EngineeringProjectPage*'
      - 'src/components/layout/ProjectWorkspaceLayout.tsx'
      - 'src/App.tsx'
      - '.github/workflows/engineering-core-app-surface.yml'
      - 'docs/changes/model-native-engineering/**'

concurrency:
  group: engineering-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- src/lib/engineering src/components/engineering src/pages/EngineeringProjectPage.test.tsx src/pages/GenericEngineeringExplorerPage.test.tsx src/pages/SourceDerivedProjectPage.test.tsx src/pages/TodoExplorerPage.test.tsx src/pages/EngineeringExplorerPage.test.tsx src/pages/EngineeringModelIntegration.test.tsx src/lib/repo/index.test.ts
      - run: npm run queue:test
      - run: npm run build
