name: Engineering source model — app integration

on:
  push:
    branches:
      - feature/engineering-core-app-surface-1-1
  pull_request:
    paths:
      - 'src/lib/engineering/core/**'
      - 'src/pages/SourceDerivedProjectPage*'
      - 'src/pages/EngineeringProjectPage*'
      - 'src/components/layout/ProjectWorkspaceLayout.tsx'
      - 'src/App.tsx'
      - '.github/workflows/engineering-core-app-surface.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- src/lib/engineering/core/analyzeTypeScript.test.ts src/lib/engineering/core/fromRepository.test.ts src/pages/SourceDerivedProjectPage.test.tsx src/pages/EngineeringProjectPage.test.tsx src/lib/repo/index.test.ts
      - run: npm run queue:test
      - run: npm run build
