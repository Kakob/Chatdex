name: Shared human + agent coding workspace

on:
  push:
    branches:
      - feature/engineering-shared-code-workspace
  pull_request:
    paths:
      - 'src/lib/engineering/**'
      - 'src/components/engineering/**'
      - 'src/pages/EngineeringExplorerPage*'
      - 'src/pages/TodoExplorerPage*'
      - 'src/pages/GenericEngineeringExplorerPage*'
      - 'examples/event-queue/**'
      - '.github/workflows/engineering-shared-code-workspace.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- src/lib/engineering/codingStore.test.ts src/lib/engineering/localWorkspaceWriter.test.ts src/lib/engineering/modelGraph.test.ts src/lib/engineering/modelStore.test.ts src/lib/engineering/liveQueue.test.ts src/components/engineering/SourceBuildWorkspace.test.tsx src/components/engineering/ModelInspector.test.tsx src/pages/EngineeringModelIntegration.test.tsx src/pages/EngineeringExplorerPage.test.tsx src/pages/TodoExplorerPage.test.tsx src/pages/EngineeringProjectPage.test.tsx src/pages/GenericEngineeringExplorerPage.test.tsx
      - run: npm run queue:test
      - run: npm run build
