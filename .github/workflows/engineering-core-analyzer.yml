name: Portable engineering core — structural analyzer

on:
  push:
    branches:
      - feature/engineering-core-analyzer-1
  pull_request:
    paths:
      - 'src/lib/engineering/core/**'
      - 'docs/changes/model-native-engineering/**'
      - '.github/workflows/engineering-core-analyzer.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- src/lib/engineering/core/analyzeTypeScript.test.ts src/lib/engineering/modelGraph.test.ts src/lib/engineering/sourceCatalog.test.ts
      - run: npm run queue:test
      - run: npm run build
