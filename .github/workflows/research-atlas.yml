name: Research Atlas checks

on:
  pull_request:
    paths:
      - 'src/features/researchAtlas/**'
      - 'src/App.tsx'
      - 'src/components/layout/Sidebar.tsx'
      - 'docs/RESEARCH-ATLAS-MVP.md'
      - '.github/workflows/research-atlas.yml'
  push:
    branches:
      - feature/research-atlas-mvp

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test -- src/features/researchAtlas/openalex.test.ts
      - run: npm run build
