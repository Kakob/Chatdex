const coreFindings = [
  make('D-001', 'Review proposed updates before they become shared memory', 'memory', 'Decision', 'Accepted', 'Extracted findings are candidates. A person must accept or edit a proposed update before it becomes canonical project understanding. Acceptance records an editorial decision; it does not erase uncertainty or contradictory evidence.', { importance: 'Critical', sources: [{ id: 'S-REVIEW', stance: 'Supports' }], links: [{ to: 'D-000', type: 'supersedes' }, { to: 'D-002', type: 'constrains' }, { to: 'P-001', type: 'constrains' }], history: [{ date: '2026-10-10', recorded: '2026-10-11', op: 'Earlier direction', text: 'Automatic application was proposed in D-000.', source: 'S-HISTORY' }, { date: '2026-10-21', recorded: '2026-10-22', op: 'Accepted', text: 'A review boundary replaced the automatic-application proposal.', source: 'S-REVIEW' }, { date: '2026-10-24', recorded: '2026-10-24', op: 'Refined', text: 'Clarified that accepting a claim does not establish its truth.', source: 'S-REVIEW' }] }),

  make('D-003', 'Pin each agent handoff to a memory revision', 'agents', 'Decision', 'Accepted', 'Pass accepted decisions, relevant questions, and a starting memory revision to the agent. Keep the resulting work receipt connected to that revision.', { sources: [{ id: 'S-HANDOFF', stance: 'Illustrates' }], links: [{ to: 'D-001', type: 'depends on' }, { to: 'Q-003', type: 'leaves open' }] }),

const concepts = [
  ['project boundaries','project membership','iteration goals','non-goals','success conditions','user roles','workspace surfaces','project identity','scope changes'],
  ['review ownership','approval shortcuts','edited proposals','rejected interpretations','pending event counts','acceptance rationale','duplicate statements','review queues','disputed decisions'],
  ['message anchors','document passages','import identity','late associations','source attribution','backfill coverage','excerpt context','deleted sources','capture gaps'],
  ['section dependencies','draft labels','regeneration timing','stale paragraphs','document revisions','canonical projections','proposed patches','section identities','consistency'],
  ['topic boundaries','search ranking','result pagination','project breadcrumbs','cross-topic links','saved filters','keyboard navigation','empty results','query context'],
  ['local persistence','encrypted sync','reconciliation cursors','unknown activity','offline updates','merge conflicts','save receipts','device divergence','cloud acknowledgements'],
  ['starting revisions','context selection','work receipts','verification reports','concurrent proposals','agent assumptions','handoff objectives','return reconciliation','unresolved blockers'],
  ['competing explanations','source limitations','event dates','recording dates','negative evidence','causal claims','participant accounts','claim lineage','evidence independence']
];
const homeSeeds = ['D-008','D-001','C-003','D-002','Q-004','D-004','D-003','D-007'];
const frames = [
  { type: 'Specification', state: 'Accepted', title: c => `Preserve ${c} across memory revisions`, body: c => `Keep ${c} attached to a stable project object rather than a transient conversation view. The proposed requirement includes revision context and a path back to the supporting source.` },
  { type: 'Question', state: 'Open question', title: c => `What should invalidate ${c}?`, body: c => `The project has not established when ${c} become stale after an import, review, or revision. Compare the affected objects with the previous revision before deciding whether to retain, revise, or reopen this understanding.` },
  { type: 'Hypothesis', state: 'Awaiting review', title: c => `A compact summary could clarify ${c}`, body: c => `A short explanation of ${c} may reduce the need to open every underlying record. Test the summary against the source passages and an alternative interpretation before treating it as accepted direction.` },
  { type: 'Claim', state: 'Disputed', title: c => `${c[0].toUpperCase()+c.slice(1)} can drift after reconciliation`, body: c => `One interpretation is that ${c} can become inconsistent when separate sessions reconcile changes against different memory revisions. Another is that the mismatch comes from incomplete source context. These explanations need different evidence.` }
];

function buildFindings(size = 300) {
  if (![25,100,300].includes(Number(size))) throw new Error('Choose 25, 100, or 300 findings.');
  const records = coreFindings.map(x => structuredClone(x));
  for (let n = 0; records.length < size; n++) {
    const topicIndex = n % 8, conceptIndex = Math.floor(n / 8) % 9, frameIndex = Math.floor(n / 72) % 4;
    const frame = frames[frameIndex], concept = concepts[topicIndex][conceptIndex];
    const id = `F-${String(n+26).padStart(3,'0')}`, sid = `S-${id}`;
    const missing = n % 17 === 8;
    const life = n % 23 === 13 ? 'Superseded' : n % 29 === 21 ? 'Resolved' : frame.state;
    const r = make(id, frame.title(concept), topics[topicIndex].id, frame.type, life, frame.body(concept), {
      date: `2026-10-${String(10+n%18).padStart(2,'0')}`,
      sources: missing ? [] : [{ id: sid, stance: frame.state === 'Disputed' ? 'Partial support' : 'Context' }],
      links: [{ to: homeSeeds[topicIndex], type: frame.type === 'Question' ? 'depends on' : 'refines' }, ...(n>=8 ? [{ to: `F-${String(n+18).padStart(3,'0')}`, type: 'related to' }] : [])],
      next: missing ? 'No source is attached. Locate a passage before relying on this statement.' : `Check whether the source actually establishes the proposed behavior for ${concept}.`
    });
    r.fixtureSource = { title: `${topics[topicIndex].short} review · ${concept}`, kind: ['Conversation','Design note','Agent trace','Research note'][frameIndex], occurred: r.date, recorded: '2026-10-28', locator: 'Synthetic excerpt · paragraphs 1–3', highlight: 1,
      lines: [`Review topic: ${concept}.`, `Candidate: ${frame.title(concept)}.`, frame.body(concept), 'This entry and its passage were generated for the interface stress test.'],
      establishes: `The fictional source records a candidate interpretation of ${concept}.`, limits: 'It is synthetic context, not an implementation test or verified project fact.' };
    records.push(r);
  }
  return records;
}

function displayState(r) {
  if (r.reviewState === 'rejected') return 'Rejected';
  if (r.reviewState === 'pending') return 'Awaiting review';
  if (r.status === 'superseded') return 'Superseded';
  if (r.status === 'resolved') return 'Resolved';
  if (r.disputed) return 'Disputed';
  if (r.type === 'Question') return 'Open question';
  return 'Accepted';
}
function sourceFor(id, records) { return sourceBank[id] || records.find(r=>r.sources.some(s=>s.id===id))?.fixtureSource; }
function searchFindings(records, { query = '', topic = 'all', status = 'all', type = 'all', sort = 'priority' } = {}) {
  const terms = query.toLowerCase().trim().split(/\s+/).filter(Boolean);
  const score = r => terms.reduce((n,t)=>n+(r.title.toLowerCase().includes(t)?4:0)+(r.id.toLowerCase()===t?12:0),0);
  return records.filter(r => {
    if (topic!=='all' && r.topic!==topic) return false;
    if (status!=='all' && displayState(r)!==status) return false;
    if (type!=='all' && r.type!==type) return false;
    const text = [r.id,r.title,r.body,r.type,displayState(r),r.topic,...r.sources.map(s=>{const p=sourceFor(s.id,records);return p?[p.title,...p.lines].join(' '):'';})].join(' ').toLowerCase();
    return terms.every(t=>text.includes(t));
  }).sort((a,b) => terms.length ? score(b)-score(a)||a.title.localeCompare(b.title) : sort==='recent' ? b.date.localeCompare(a.date)||a.title.localeCompare(b.title) : ({Critical:0,High:1,Normal:2}[a.importance]-{Critical:0,High:1,Normal:2}[b.importance])||a.title.localeCompare(b.title));
}
function projectStats(records) {
  return { total: records.length,
    accepted: records.filter(r=>r.reviewState==='accepted'&&r.status==='current').length,
    open: records.filter(r=>r.type==='Question'&&r.status==='current'&&r.reviewState!=='rejected').length,
    pending: records.filter(r=>r.reviewState==='pending').length,
    disputed: records.filter(r=>r.disputed&&r.status==='current'&&r.reviewState!=='rejected').length,
    missing: records.filter(r=>r.sources.length===0).length,
    historical: records.filter(r=>r.status==='superseded').length };
}

  state.offset=Math.min(state.offset,Math.max(0,Math.ceil(matches.length/pageSize)-1)*pageSize);
  return `<div class="workspace-panel"><section class="results-pane ${state.selected?'has-selection':''}" aria-label="Finding results"><div class="results-heading"><div class="between"><h2>${esc(state.query?'Search results':state.topic==='all'?'All findings':topicName(state.topic))}</h2><span class="count" aria-live="polite">${matches.length} of ${state.size}</span></div><p>${state.query?'Matching all query terms across findings and sources.':state.topic==='all'?'Sorted by importance. Review and historical states stay visible.':esc(topics.find(t=>t.id===state.topic)?.description)}</p></div>
    ${matches.length?matches.slice(state.offset,state.offset+pageSize).map(r=>resultRow(r)).join(''):`<div class="empty"><h3>No matching findings</h3><p>Try fewer words or clear the current filters.</p><br>${actionButton('Clear filters','clear')}</div>`}
    ${pagination(matches.length)}</section><section class="detail-pane" aria-label="Finding detail">${state.selected?renderDetail(record(state.selected)):`<div class="detail-empty"><span class="eyebrow">Overview → Topic → Finding → Source</span><h3>Choose a finding to inspect</h3><p>The topic outline and results stay available while you examine the evidence, history, and relationships.</p></div>`}</section></div>`;
}

function relations(r) {
  const reverse = {'supersedes':'superseded by','superseded by':'supersedes','depends on':'required by','constrains':'constrained by','must respect':'constrains','conflicts with':'conflicts with','refines':'refined by','supported by':'supports','supports':'supported by','related to':'related to','bounded by':'bounds','alternative':'alternative to','candidate answer':'candidate answer from','complicates':'complicated by','challenged by':'challenges','leaves open':'bounded by','informs':'informed by','responds to':'response from','preserves':'preserved by','resolved by':'resolves','tested by':'tests','tests':'tested by','requires':'required by'};
  const out = r.links.filter(l=>record(l.to)).map(l=>({...l, direction:'out'}));
  const used = new Set(out.map(l=>l.to));
  for (const other of records) for (const l of other.links) if(l.to===r.id&&!used.has(other.id)){out.push({to:other.id,type:reverse[l.type]||`incoming: ${l.type}`,direction:'in'});used.add(other.id);}
  return out.sort((a,b)=>({Critical:0,High:1,Normal:2}[record(a.to).importance]-{Critical:0,High:1,Normal:2}[record(b.to).importance]));
}

function relationRows(r, limit=state.relationLimit) {
  const links=relations(r);
  return `${links.slice(0,limit).map(l=>`<button class="relation-row" data-action="open" data-id="${l.to}"><span class="relation-type">${esc(l.type)}</span><p>${esc(record(l.to).title)}</p><span class="mono">${l.to} · ${displayState(record(l.to))} · ${topicName(record(l.to).topic)}</span></button>`).join('') || '<p class="secondary">No explicit finding relationships.</p>'}${links.length>limit?actionButton(`Show all ${links.length} relationships →`,'more-relations','','text-link'):''}`;
}

function graphPositions() {
  const positions = new Map();
  topics.forEach((topic,ti)=>{
    const own=records.filter(r=>r.topic===topic.id);
    own.forEach((r,i)=>{
      const angle=i*2.399963229728653;
      const radius=17+Math.sqrt(i)*12.5;
      positions.set(r.id,{x:150+(ti%4)*245+Math.cos(angle)*radius,y:166+Math.floor(ti/4)*280+Math.sin(angle)*radius});
    });
  });
  return positions;
}

function graphColor(r) {
  const s=displayState(r);
  return s==='Disputed'?'#bb645d':s==='Awaiting review'||s==='Open question'?'#ba9255':s==='Superseded'||s==='Rejected'?'#a8b2ac':s==='Resolved'?'#6c8db6':'#599878';
}

function renderDotGraph() {
  const selected=record(state.selected), positions=graphPositions();
  let visible=searchFindings(records,state);
  let hiddenRelations=0;
  if(state.neighborhood&&selected){const near=relations(selected);hiddenRelations=Math.max(0,near.length-8);visible=[selected,...near.slice(0,8).map(l=>record(l.to))];}
  const visibleIds=new Set(visible.map(r=>r.id));
  const edges=[];
  for(const r of visible)for(const l of r.links)if(visibleIds.has(l.to))edges.push({from:r.id,to:l.to,type:l.type,pending:r.reviewState==='pending'||record(l.to).reviewState==='pending'});
  const labelAll=visible.length<=12;
  return `<p class="mode-description">An interactive graph: pan the canvas, zoom, search, or choose a finding. This view shows finding relationships; inspect evidence in the detail pane. Pending relationship assertions use dashed lines.</p>
  <div class="graph-layout ${selected?'has-detail':''}"><section class="graph-panel" aria-label="Interactive finding graph">
  <div class="graph-toolbar"><span class="graph-stat">${visible.length} findings · ${edges.length} directed links${state.neighborhood?' · local neighborhood':''}</span><div class="row" style="gap:5px">${actionButton('−','zoom-out','aria-label="Zoom out"')}${actionButton('+','zoom-in','aria-label="Zoom in"')}${actionButton('Reset','graph-reset')}${actionButton(state.neighborhood?'All findings':'Neighborhood','graph-focus',`${!selected?'disabled':''}`)}</div></div>
  <div class="graph-canvas"><svg id="finding-graph" viewBox="0 0 1040 600" role="img" aria-label="${visible.length} synthetic findings grouped by topic. Select a point to inspect it; use search and the accessible list below to locate named findings."><defs><marker id="relation-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9baea1"/></marker></defs><g id="graph-world" transform="translate(${state.panX} ${state.panY}) translate(520 300) scale(${state.zoom}) translate(-520 -300)">
  ${topics.map((t,i)=>visible.some(r=>r.topic===t.id)?`<text class="graph-topic-label" x="${150+(i%4)*245}" y="${44+Math.floor(i/4)*280}" text-anchor="middle">${t.short}</text>`:'').join('')}
  ${edges.map(l=>{const a=positions.get(l.from),b=positions.get(l.to);const active=selected&&(l.from===selected.id||l.to===selected.id);return `<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" stroke="${active?'#4b8d70':'#bdcbc0'}" stroke-width="${active?1.6:.7}" opacity="${selected&&!active?.22:active?.9:.44}" ${l.pending?'stroke-dasharray="4 4"':''} marker-end="url(#relation-arrow)"/>`;}).join('')}
  ${visible.map(r=>{const p=positions.get(r.id),isSelected=r.id===state.selected;const related=selected?relations(selected).some(l=>l.to===r.id):false;const label=labelAll||isSelected;return `<a class="graph-node" href="#finding-${r.id}" data-action="open" data-id="${r.id}" aria-label="Open ${r.id}: ${esc(r.title)}" opacity="${selected&&!isSelected&&!related?.3:1}"><title>${esc(r.id+' · '+r.title+' · '+displayState(r))}</title><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${isSelected?8:r.importance==='Critical'?6:4.5}" fill="${graphColor(r)}" stroke="${isSelected?'#1e5b41':'white'}" stroke-width="${isSelected?3:1}"/>${label?`<text class="graph-label" x="${p.x.toFixed(1)}" y="${(p.y+21).toFixed(1)}" text-anchor="middle">${esc(r.id)}<tspan x="${p.x.toFixed(1)}" dy="13">${esc(r.title.length>33?r.title.slice(0,31)+'…':r.title)}</tspan></text>`:''}</a>`;}).join('')}
  </g></svg></div>
  <div class="graph-legend">${[['#599878','Accepted'],['#ba9255','Open / pending'],['#bb645d','Disputed'],['#a8b2ac','Historical / rejected'],['#6c8db6','Resolved']].map(([c,n])=>`<span><span class="legend-dot" style="background:${c}"></span>${n}</span>`).join('')}<span>Arrow = direction · dashed = pending</span></div>
  <div class="graph-caption">${hiddenRelations?`${hiddenRelations} additional relationships omitted from this bounded neighborhood. ${actionButton('Inspect all links','detail-tab','data-id="links"','text-link')}`:visible.length>100?'At this scale, topic labels remain readable; individual claims require search, zoom, or selection.':visible.length?'Points are individual findings. Search narrows the graph without changing their positions.':'No graph points match these filters. Clear filters to return to the full graph.'}</div>
  <details style="padding:12px 14px;border-top:1px solid var(--line)"><summary class="small muted">Accessible finding list · ${visible.length}</summary><div>${visible.slice(state.offset,state.offset+pageSize).map(r=>resultRow(r,true)).join('')}${pagination(visible.length)}</div></details>
  </section>${selected?`<section class="detail-pane" aria-label="Graph selection detail">${renderDetail(selected)}</section>`:''}</div>`;
}

function wireGraph() {
  const svg=document.getElementById('finding-graph');
  if(!svg)return;
  let drag=null;
  svg.addEventListener('pointerdown',ev=>{
    if(ev.target.closest('a'))return;
    drag={x:ev.clientX,y:ev.clientY,panX:state.panX,panY:state.panY};svg.setPointerCapture(ev.pointerId);svg.classList.add('dragging');
  });
  svg.addEventListener('pointermove',ev=>{
    if(!drag)return;
    const box=svg.getBoundingClientRect(),scale=Math.max(1040/box.width,600/box.height);
    state.panX=drag.panX+(ev.clientX-drag.x)*scale;state.panY=drag.panY+(ev.clientY-drag.y)*scale;
    document.getElementById('graph-world')?.setAttribute('transform',`translate(${state.panX} ${state.panY}) translate(520 300) scale(${state.zoom}) translate(-520 -300)`);
  });
  svg.addEventListener('pointerup',()=>{if(drag)track('pan');drag=null;svg.classList.remove('dragging');});
}

  <tr><td>Important unresolved issues and disagreements</td><td>Competing interpretations, source limitations, next discriminating check</td><td>Question → alternatives; supporting and challenging sources remain distinct.</td></tr>
  <tr><td>What is pending, accepted, or historical</td><td>Append-only change events, replacement chain, event time and recording time</td><td>Earlier decision → successor. A pending proposal is visibly separate from accepted direction.</td></tr>
  <tr><td>Topic shape, collection size, and source freshness limits</td><td>Individual records; local/cloud save state; source reconciliation gap</td><td>Topic → finding plus cross-topic links. Saving and source freshness are independent.</td></tr>
  </tbody></table></div>
  <h2>Three approaches, one collection</h2>
  <div class="table-scroll"><table><thead><tr><th>Approach</th><th>What this prototype demonstrates</th><th>Where it breaks down</th></tr></thead><tbody>
  <tr><td><strong>Categorized overview</strong><br>${actionButton('Try Categories →','compare','data-id="categories"','text-link')}</td><td>Eight expandable topics, status counts, ten records per page, full-page finding inspection, and a return to the outline.</td><td>The overview is compact, but cross-topic disagreements are hidden until a record is opened. Returning from a source preserves the finding; returning to the outline adds a navigation step.</td></tr>
  <tr><td><strong>Interactive graph</strong><br>${actionButton('Try Graph →','compare','data-id="graph"','text-link')}</td><td>Real selectable findings and directed links, pan, zoom, stable positions, search/filter narrowing, and an eight-neighbor focus with an explicit omitted-link count.</td><td>At 300 records the all-findings view is a topology overview, not a readable statement overview. Claim text needs search or selection. A local graph needs a chosen entry point.</td></tr>
  <tr><td><strong>Overview + detail workspace</strong><br>${actionButton('Try Workspace →','compare','data-id="workspace"','text-link')}</td><td>A bounded project brief and attention queue; topic navigation; ten-result pages; retained list context; evidence and history tabs; named local links.</td><td>It depends on useful summaries and honest prioritization. This prototype hand-selects the key decisions and attention items. It has not solved automatic ranking or summary maintenance.</td></tr>
  </tbody></table></div>
  <h2>Stress test: 25 → 100 → 300</h2>
  <p>The same 25 authored fixture records remain in all collections. The larger sets add distinct topic-specific specifications, questions, hypotheses, disputed claims, historical records, missing sources, and cross-links. The 300-record set includes near-topic distractors such as draft labels, regeneration timing, review ownership, and acceptance rationale. Generated entries are template-based: useful load, not the full messiness of real project memory.</p>
  ${renderResults()}
  <p>Task success here means that the expected record and relevant passage were reachable through the interface. It does <strong>not</strong> establish that a person understood the issue, preferred this layout, or could find an unanticipated important decision. Navigation time from an automated tester is not treated as a human speed measure.</p>
  <p><strong>What the scale test isolates:</strong> eight topic entry points and ten-result pages remain bounded as the collection grows. The selected decision and issue remain directly reachable from the brief. An evidence query searches source passages, not just record titles. The full graph grows with the corpus; the workspace’s reading surface does not.</p>
  <h3 style="margin-top:24px">Your trials in this browser session</h3>${trials.length?`<div class="table-scroll"><table><thead><tr><th>Collection / approach</th><th>Task</th><th>Actions</th><th>Records opened</th><th>Sources inspected</th></tr></thead><tbody>${trials.map(t=>`<tr><td>${t.size} · ${t.mode}</td><td>${t.task}</td><td>${t.actions}</td><td>${t.records} / ${t.size}</td><td>${t.sources}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No completed task routes in this session yet. Open Task lab in the prototype to collect them.</p>'}
  <h2>Reuse in the existing Chatdex codebase</h2>
  <p>I inspected <code>Kakob/Chatdex</code>, branch <code>feature/project-workspace-golden-path</code>, on Oct 28. The existing map is already a supersession-chain timeline, <em>not</em> an all-purpose force graph. This experiment does not modify the repository or claim the application has hundreds of populated understanding records.</p>
  <div class="table-scroll"><table><thead><tr><th>Existing code inspected</th><th>Reuse opportunity</th><th>Change still needed</th></tr></thead><tbody>
  <tr><td>${realLink(sourceURLs.repo+'src/types/understanding.ts','UnderstandingObject / UnderstandingEvent')}</td><td>Retain separate reviewState and lifecycle status; evidence on events; source time and recording time.</td><td>Add topic assignment as a view concern. “Disputed” is an evidence assessment, not a replacement lifecycle enum.</td></tr>
  <tr><td>${realLink(sourceURLs.repo+'src/lib/understanding/overview.ts','assembleOverview')}</td><td>Reuse rollups, questions, and capped recent changes; assemble from stored rows without an LLM call.</td><td>Its current object count includes pending objects. Do not label it “accepted direction” without an accepted-only projection.</td></tr>
  <tr><td>${realLink(sourceURLs.repo+'src/components/understanding/HistoryDrawer.tsx','HistoryDrawer')}<br>${realLink(sourceURLs.repo+'src/components/understanding/EvidenceLinks.tsx','EvidenceLinks')}</td><td>Preserve event history, replacement-chain navigation, and message-anchored evidence links.</td><td>Allow an in-workspace inspector and excerpt preview, retaining the source-reader route. Expand beyond conversation-only refs where required.</td></tr>
  <tr><td>${realLink(sourceURLs.repo+'src/components/understanding/LivingDocumentView.tsx','LivingDocumentView')}</td><td>Keep the exportable Markdown projection and its copy/download behavior.</td><td>Add an overview reading projection with linked sections instead of making raw Markdown the primary large-memory navigation.</td></tr>
  <tr><td>${realLink(sourceURLs.repo+'src/components/understanding/ProjectMapView.tsx','ProjectMapView')}<br>${realLink(sourceURLs.repo+'src/lib/understanding/map.ts','assembleProjectMap')}</td><td>Reuse the deterministic supersession-chain view for historical decisions.</td><td>The inspected schema has a target object for supersession only. Generic supports, conflicts, and dependencies in this demo need an explicit reviewed relation model with provenance; they are not drop-in existing edges.</td></tr>
  </tbody></table></div>
  <p>This prototype uses plain browser code to stay self-contained and independent of the full React application. The reuse assessment concerns actual inspected components and semantics; their source code was not pasted into this standalone experiment.</p>
  <h2>Recommendation and the next falsifiable test</h2>
  <div class="verdict"><p><strong>Use the combined workspace as the next bounded iteration.</strong> The experiment demonstrates project → topic → record → passage navigation, preserved local context, separate opposing evidence, and a bounded reading surface with 300 findings. Keep the existing chain map for history and offer the global graph as an optional exploration mode.</p><p>The recommendation is conditional: prioritization is hand-authored here. Before larger implementation, replace these fixtures with 100–300 real promoted findings and ask someone unfamiliar with the project to perform the same three tasks. Remove the hand-selected target links in a second round to test whether topics and search carry the work.</p></div>
  <ol><li>Try five unfamiliar decisions or questions, including one in the long tail, one with an absent source, and one with a misleading category.</li><li>After locating the regeneration issue, ask the participant to explain what is settled, what remains open, and what evidence would change their view. Score the explanation against the cited passages, not completion clicks.</li><li>Compare approaches with the same tasks and alternate their order. Record wrong turns, records opened, source inspection, and ability to return to the project state.</li><li>Make the next change based on the failure: revise summary selection if overview misses matter; improve topic assignment if navigation fails; improve passage anchors if verification fails.</li></ol>
  <p class="footnote">No human usability study, production integration, real memory import, automatic summary generation, sync fix, or performance guarantee is claimed by this experiment.</p>
  </article>`;
}

function renderResults() {
  if(!experimentResults.verified)return `<div class="callout warn"><strong>Verification in progress</strong><p>${esc(experimentResults.note)}</p></div>`;
  return `<div class="table-scroll"><table><thead><tr><th>Findings</th><th>Important decision</th><th>Unresolved issue</th><th>Relevant evidence</th><th>Verification</th></tr></thead><tbody>${experimentResults.rows.map(r=>`<tr><td><strong>${r.size}</strong></td><td>${r.decision}</td><td>${r.issue}</td><td>${r.evidence}</td><td class="result-pass">${r.result}</td></tr>`).join('')}</tbody></table></div><p class="footnote">${esc(experimentResults.method)}</p><p class="footnote">${esc(experimentResults.checks)}</p>`;
}

function openSource(id, findingId) {
  const s=sourceFor(id,records);
  if(!s)return;
  track('source',id);
  sourceDialog.innerHTML=`<div class="source-header"><div class="between"><span class="pill synthetic">Synthetic source · ${id}</span>${actionButton('Close','close-source','','btn subtle')}</div><h2 id="source-title">${esc(s.title)}</h2><span class="small muted">${s.kind} · ${esc(s.locator)}</span></div><div class="source-content"><dl class="source-provenance"><div><dt>Event / source date</dt><dd>${s.occurred}</dd></div><div><dt>Recorded in fixture</dt><dd>${s.recorded}</dd></div></dl><div class="source-passage" aria-label="Source passage with cited line highlighted">${s.lines.map((line,i)=>`<div class="source-line ${i===s.highlight?'highlight':''}"><span class="line-num">${i+1}</span><span>${esc(line)}</span></div>`).join('')}</div><h3>What this passage establishes</h3><p>${esc(s.establishes)}</p><h3>What it does not establish</h3><p>${esc(s.limits)}</p></div><div class="source-bottom"><span class="small">Linked from ${esc(findingId)}. No real source record exists for this fixture.</span>${actionButton('Back to finding','close-source','','btn primary')}</div>`;
  render();
  sourceDialog.showModal();
}

function download(name,contents,type) {
  const url=URL.createObjectURL(new Blob([contents],{type}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function handleAction(ev) {
  const b=ev.target.closest('[data-action]');
  if(!b||b.disabled)return;
  ev.preventDefault();
  const action=b.dataset.action,id=b.dataset.id;
  if(action==='land-home'){land.topic=null;land.cluster=null;state.selected=null;landFocus(-150,-200,8650);return;}
  else if(action==='land-topic'){const t=landGroups().find(t=>t.id===id);land.topic=id;land.cluster=null;state.selected=null;landFocus(t.x-100,t.y-80,2100);return;}
  else if(action==='land-cluster'){const t=landGroups().find(t=>t.groups.some(g=>g.key===id)),g=t.groups.find(g=>g.key===id);land.topic=t.id;land.cluster=g.name;state.selected=null;landFocus(g.x-140,g.y-100,850);return;}
  else if(action==='land-find'){const t=landGroups().find(t=>t.own.some(r=>r.id===id)),g=t.groups.find(g=>g.rows.some(r=>r.id===id));land.topic=t.id;land.cluster=g.name;state.selected=null;landFocus(g.x-140,g.y-100,850);return;}
  else if(action==='land-in'||action==='land-out'){const c=land.camera,w=Math.max(600,Math.min(10000,c.w*(action==='land-in'?.5:2)));landFocus(c.x+(c.w-w)/2,c.y+(c.h-w*.56)/2,w);return;}
  else if(action==='graph-style'){state.graphStyle=id;state.selected=null;}
  else if(action==='map-topic'){state.mode='workspace';state.scope='browse';state.topic=id;state.selected=null;state.offset=0;}
  else if(action==='overview'){track('overview');state.page='memory';resetOverview();}
  else if(action==='all'){track('all');state.page='memory';state.topic='all';state.scope='browse';state.selected=null;state.offset=0;state.neighborhood=false;}
  else if(action==='topic'){track('topic',id);state.page='memory';state.scope='browse';state.topic=id;state.selected=null;state.offset=0;state.expanded=id;state.neighborhood=false;}
  else if(action==='open'){track('record',id);state.page='memory';state.selected=id;state.scope='browse';state.detailTab='summary';state.relationLimit=6;if(state.mode==='categories')state.expanded=record(id).topic;}
  else if(action==='close-detail'){track('close-record');state.selected=null;state.detailTab='summary';state.neighborhood=false;}
  else if(action==='detail-tab'){track('detail-tab',id);state.detailTab=id;}
  else if(action==='more-relations'){track('more-links');state.detailTab='links';state.relationLimit=records.length;}
  else if(action==='back-categories'){track('back-to-outline');state.selected=null;}
  else if(action==='lens'){track('status-filter',id);state.page='memory';state.scope='browse';state.status=id;state.topic='all';state.query='';state.selected=null;state.offset=0;}
  else if(action==='clear'){track('clear');state.query='';state.status='all';state.type='all';state.selected=null;state.offset=0;}
  else if(action==='mode'){state.mode=id;state.offset=0;state.zoom=1;state.panX=0;state.panY=0;state.trial=null;}
  else if(action==='size'){state.size=Number(id);records=buildFindings(state.size);resetOverview();state.trial=null;}
  else if(action==='expand'){track('expand-topic',id);state.expanded=state.expanded===id?null:id;state.offset=0;}
  else if(action==='prev'||action==='next'){track('pagination');if(b.dataset.context!=='list')state.expanded=b.dataset.context;state.offset=Math.max(0,state.offset+(action==='next'?pageSize:-pageSize));}
  else if(action==='zoom-in'||action==='zoom-out'){track('zoom');state.zoom=Math.max(.6,Math.min(4,state.zoom+(action==='zoom-in'?.25:-.25)));}
  else if(action==='graph-reset'){track('graph-reset');state.zoom=1;state.panX=0;state.panY=0;}
  else if(action==='graph-focus'){track('graph-focus');state.neighborhood=!state.neighborhood;state.zoom=1;state.panX=0;state.panY=0;}
  else if(action==='source'){openSource(id,b.dataset.finding);return;}
  else if(action==='close-source'){sourceDialog.close();return;}
  else if(action==='notes'){state.page='notes';}
  else if(action==='prototype'){state.page='memory';}
  else if(action==='recommendation'||action==='compare'){state.page='memory';state.mode=action==='compare'?id:'workspace';resetOverview();}
  else if(action==='trial-toggle'){state.trialVisible=!state.trialVisible;}
  else if(action==='trial-start'){resetOverview();state.trial={task:state.taskChoice,actions:0,records:new Set(),sources:new Set(),started:performance.now(),completed:false};}
  else if(action==='download-data'){download(`chatdex-synthetic-${state.size}.json`,JSON.stringify({synthetic:true,description:'Representative interface fixtures. Not existing Chatdex records.',findings:records,sources:sourceBank},null,2),'application/json');return;}
  else if(action==='download-html'){download('chatdex-current-understanding.html','<!doctype html>\n'+document.documentElement.outerHTML,'text/html');return;}
  render();
  if(['notes','prototype','recommendation','compare','overview'].includes(action))window.scrollTo({top:0,behavior:'instant'});
}
app.addEventListener('click',handleAction);
sourceDialog.addEventListener('click',handleAction);
sourceDialog.addEventListener('close',()=>{track('source-close');render();});
app.addEventListener('change',ev=>{
  if(ev.target.id==='task-choice'){state.taskChoice=ev.target.value;return;}
  const key=ev.target.dataset.filter;
  if(key){track('filter',key);state[key]=ev.target.value;state.scope='browse';state.offset=0;state.selected=null;state.neighborhood=false;render();}
});
app.addEventListener('submit',ev=>{
  if(ev.target.id!=='search-form')return;
  ev.preventDefault();
  const q=document.getElementById('project-search').value.trim();
  if(q!==state.query)track('search',q);
  state.query=q;state.scope='browse';state.selected=null;state.offset=0;state.neighborhood=false;render();
  announcer.textContent=`${searchFindings(records,state).length} findings match the current search.`;
});
app.addEventListener('search',ev=>{if(ev.target.id==='project-search'&&ev.target.value===''){state.query='';state.offset=0;state.selected=null;render();}},true);
// Semantic landscape: all records have stable coordinates in the same world.
const land = {camera:{x:-150,y:-200,w:8650,h:4200}, topic:null, cluster:null};
function landGroups(){return topics.map((t,ti)=>{const own=records.filter(r=>r.topic===t.id),groups=[];for(const type of [...new Set(own.map(r=>r.type))].sort()){const rows=own.filter(r=>r.type===type);for(let j=0;j<rows.length;j+=8)groups.push({name:type+(rows.length>8?' '+(j/8+1):''),rows:rows.slice(j,j+8)});}const x=(ti%4)*2150,y=Math.floor(ti/4)*2150;groups.forEach((g,i)=>{g.x=x+220+(i%3)*560;g.y=y+330+Math.floor(i/3)*530;g.key=t.id+'-'+i;g.rows.forEach((r,j)=>{g.rows[j]={...r,lx:g.x+(j%3)*170,ly:g.y+Math.floor(j/3)*145};});});return {...t,x,y,groups,own};});}
function landLevel(){return land.camera.w>3600?0:land.camera.w>1250?1:2;}
function landText(text,x,y,size,width,color='#244d3c'){const words=text.split(' '),lines=[];let line='';for(const w of words){if((line+' '+w).length>width){lines.push(line);line=w;}else line+=(line?' ':'')+w;}if(line)lines.push(line);return `<text x="${x}" y="${y}" text-anchor="middle" fill="${color}" font-size="${size}">${lines.map((l,i)=>`<tspan x="${x}" dy="${i?size*1.35:0}">${esc(l)}</tspan>`).join('')}</text>`;}
function landFocus(x,y,w){land.camera={x,y,w,h:w*.56};render();}
function renderLandscape(){const gs=landGroups(),level=landLevel(),cam=land.camera,matches=searchFindings(records,state),hits=new Set(matches.map(r=>r.id)),filtered=state.query||state.status!=='all'||state.type!=='all'||state.topic!=='all';const screenFont=cam.w/1000*13;const positions=new Map();gs.forEach(t=>t.groups.forEach(g=>g.rows.forEach(r=>positions.set(r.id,r))));
return `<div class="land-heading"><div><h2>A landscape of understanding</h2><p>Every finding lives here. Expand a region, follow a branch, or zoom toward a statement.</p></div><div class="row">${actionButton('−','land-out','aria-label="Zoom landscape out"')}${actionButton('+','land-in','aria-label="Zoom landscape in"')}${actionButton('Whole project','land-home')}</div></div><div class="land-crumb">${actionButton('Project','land-home','','text-link')}${land.topic?' / '+actionButton(esc(topicName(land.topic)),'land-topic',`data-id="${land.topic}"`,'text-link'):''}${land.cluster?' / '+esc(land.cluster):''}<span class="spacer"></span><span>${level===0?'REGIONS':level===1?'CLUSTERS':'FINDINGS'} · ${state.size} reachable records</span></div><div class="land-canvas"><svg id="land-svg" viewBox="${cam.x} ${cam.y} ${cam.w} ${cam.h}" aria-label="Zoomable project landscape" role="img"><defs><pattern id="land-dots" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r="2" fill="#b5c9bd"/></pattern></defs><rect x="-20000" y="-20000" width="50000" height="50000" fill="#edf3e9"/><rect x="-20000" y="-20000" width="50000" height="50000" fill="url(#land-dots)"/>
${level===0?`<path d="M900 900 Q1900 100 3050 900 T5200 900 T7350 900 M900 3050 Q2500 2000 5200 3050 T7350 3050 M3050 900 Q4000 2000 3050 3050" fill="none" stroke="#a8bfae" stroke-width="18"/>`:''}
${gs.map(t=>{const matchCount=t.own.filter(r=>hits.has(r.id)).length;return `<g opacity="${filtered&&!matchCount?.22:1}"><ellipse cx="${t.x+900}" cy="${t.y+900}" rx="970" ry="940" fill="${t.id===land.topic?'#e0eedc':'#e5eedf'}" stroke="#b9cdb8" stroke-width="${level===0?7:2}"/>${level===0?`<a href="#${t.id}" data-action="land-topic" data-id="${t.id}"><ellipse cx="${t.x+900}" cy="${t.y+900}" rx="930" ry="900" fill="transparent"/>${landText(t.name,t.x+900,t.y+550,105,28)}${landText(t.takeaway,t.x+900,t.y+800,78,35)}${landText((filtered?matchCount+' matches · ':'')+t.own.length+' findings · expand →',t.x+900,t.y+1250,68,38,'#66866b')}</a>`:`${landText(t.name,t.x+900,t.y+130,45,35)}${t.groups.map(g=>level===1?`<path d="M${t.x+900} ${t.y+165} Q${g.x+170} ${t.y+200} ${g.x+170} ${g.y+120}" fill="none" stroke="#a4c0a6" stroke-width="4"/><a href="#${g.key}" data-action="land-cluster" data-id="${g.key}"><circle cx="${g.x+170}" cy="${g.y+120}" r="140" fill="#f8fbf4" stroke="#779e7c" stroke-width="4"/>${landText(g.name,g.x+170,g.y+100,Math.min(screenFont,37),22)}${landText(g.rows.length+' findings →',g.x+170,g.y+160,Math.min(screenFont,28),24)}</a>`:g.rows.map(r=>`<a href="#${r.id}" data-action="open" data-id="${r.id}" opacity="${filtered&&!hits.has(r.id)?.18:1}"><circle cx="${r.lx}" cy="${r.ly}" r="${r.id===state.selected?17:11}" fill="${graphColor(r)}" stroke="white" stroke-width="3"/>${landText(r.title,r.lx,r.ly+30,Math.max(11,Math.min(14,screenFont)),22)}<title>${esc(r.id+' · '+displayState(r))}</title></a>`).join('')).join('')}`}</g>`;}).join('')}
${level===2?records.flatMap(r=>r.links.map(l=>{const a=positions.get(r.id),b=positions.get(l.to);if(!a||!b)return '';if(state.selected&&r.id!==state.selected&&l.to!==state.selected)return '';return `<path d="M${a.lx} ${a.ly} Q${(a.lx+b.lx)/2} ${Math.min(a.ly,b.ly)-60} ${b.lx} ${b.ly}" fill="none" stroke="${state.selected?'#568265':'#93b69a'}" stroke-width="${state.selected?2:1}" opacity="${state.selected?.8:.25}" pointer-events="none"/>`;})).join(''):''}</svg><div class="land-help">Drag to explore · scroll to zoom · click regions to expand</div></div>${filtered?`<div class="land-search"><strong>${matches.length} matches</strong>${matches.slice(0,12).map(r=>actionButton(esc(r.id+' · '+r.title),'land-find',`data-id="${r.id}"`,'land-search-hit')).join('')}${matches.length>12?'<p>Narrow the query to locate a particular finding.</p>':''}</div>`:''}<p class="map-foot">Stable locations · clusters contain at most eight findings · all ${state.size} records are mapped. Project-level paths suggest proximity; finding-level lines follow the fixture’s explicit relationships. Summaries and data are synthetic.</p>${state.selected?`<aside class="map-inspector" aria-label="Selected statement"><div class="map-inspector-label">${actionButton('Locate on map','land-find',`data-id="${state.selected}"`,'text-link')} · evidence & history</div>${renderDetail(record(state.selected))}</aside>`:''}`;}
function wireLandscape(){const svg=document.getElementById('land-svg');if(!svg)return;let start=null;svg.addEventListener('pointerdown',e=>{if(e.target.closest('a'))return;start={x:e.clientX,y:e.clientY,c:{...land.camera}};svg.setPointerCapture(e.pointerId);});svg.addEventListener('pointermove',e=>{if(!start)return;const k=land.camera.w/svg.getBoundingClientRect().width;land.camera.x=start.c.x-(e.clientX-start.x)*k;land.camera.y=start.c.y-(e.clientY-start.y)*k;svg.setAttribute('viewBox',`${land.camera.x} ${land.camera.y} ${land.camera.w} ${land.camera.h}`);});svg.addEventListener('pointerup',()=>{start=null;});svg.addEventListener('wheel',e=>{e.preventDefault();const box=svg.getBoundingClientRect(),rx=(e.clientX-box.left)/box.width,ry=(e.clientY-box.top)/box.height,c=land.camera,f=e.deltaY>0?1.22:.82,w=Math.max(600,Math.min(10000,c.w*f));land.camera={x:c.x+rx*(c.w-w),y:c.y+ry*(c.h-w*.56),w,h:w*.56};render();},{passive:false});}

render();
</script>
